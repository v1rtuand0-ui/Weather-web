<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: { base: '#0B0B0C', base2: '#1A1A1C', muted: '#8A8A8E', accent: '#F5A524' },
          animation: {
            float: 'float 6s ease-in-out infinite',
            shimmer: 'shimmer 1.5s linear infinite'
          },
          keyframes: {
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            shimmer: { '0%': { backgroundPosition: '200% 0' }, '100%': { backgroundPosition: '-200% 0' } }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans text-white min-h-screen">
  <div class="max-w-7xl mx-auto px-6 md:px-10 py-8 md:py-10">

    <!-- Header -->
    <header class="relative">
      <div class="flex items-center justify-center gap-3 flex-wrap">
        <button id="city-button" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="city-name" class="text-sm">Loading...</span>
          <svg class="w-3.5 h-3.5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <span id="date-text" class="text-xs text-muted"></span>
      </div>

      <div id="search-panel" class="hidden absolute top-full mt-3 left-1/2 -translate-x-1/2 z-20 w-80 max-w-[calc(100vw-2rem)] bg-black/90 backdrop-blur-xl border border-white/10 rounded-2xl p-3 shadow-2xl">
        <input id="search-input" type="text" placeholder="Search city..."
          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-sm placeholder-muted focus:outline-none focus:border-accent/50 transition">
        <ul id="search-results" class="mt-2 space-y-1 max-h-64 overflow-y-auto"></ul>
      </div>
    </header>

    <!-- Main -->
    <main class="mt-10 md:mt-16 grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] gap-8 lg:gap-12 items-start">

      <!-- Left -->
      <section class="lg:pt-8 order-1">
        <div class="flex items-start">
          <span id="temp-value" class="text-8xl md:text-9xl font-extralight leading-none">--</span>
          <span class="text-2xl md:text-3xl font-light mt-2 md:mt-3 ml-1">°<span id="temp-unit">C</span></span>
        </div>
        <p id="condition-text" class="text-2xl md:text-3xl font-light mt-4">--</p>

        <div class="flex gap-10 mt-8">
          <div>
            <div class="flex items-center gap-1.5 text-muted text-xs">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
              </svg>
              <span>Wind</span>
            </div>
            <p class="text-2xl font-light mt-1">
              <span id="wind-value">--</span><span class="text-sm text-muted ml-1">km/h</span>
            </p>
          </div>
          <div>
            <div class="flex items-center gap-1.5 text-muted text-xs">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
              </svg>
              <span>Humidity</span>
            </div>
            <p class="text-2xl font-light mt-1">
              <span id="humidity-value">--</span><span class="text-sm text-muted ml-1">%</span>
            </p>
          </div>
        </div>
      </section>

      <!-- Center -->
      <section class="order-2 flex justify-center">
        <div class="relative w-56 h-56 md:w-72 md:h-72 flex items-center justify-center">
          <div class="absolute inset-0 glow-bg rounded-full"></div>
          <div id="weather-icon" class="relative w-40 h-40 md:w-56 md:h-56 animate-float flex items-center justify-center"></div>
        </div>
      </section>

      <!-- Right -->
      <section class="order-3 lg:pt-2">
        <div id="daily-list" class="daily-card rounded-3xl p-4 md:p-5 w-full lg:w-80"></div>
      </section>
    </main>

    <!-- Hourly -->
    <section class="mt-10 md:mt-16">
      <div class="flex items-stretch gap-4">
        <div class="flex-1 overflow-x-auto no-scrollbar">
          <div id="hourly-track" class="relative min-w-[600px] md:min-w-0">
            <svg id="hourly-curve" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
            <div id="hourly-items" class="relative flex h-full"></div>
          </div>
        </div>
        <div class="hidden md:flex flex-col justify-center gap-2">
          <button id="hour-prev" class="w-9 h-9 rounded-lg border border-white/10 hover:bg-white/5 flex items-center justify-center transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button id="hour-next" class="w-9 h-9 rounded-lg border border-white/10 hover:bg-white/5 flex items-center justify-center transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-muted">
      Weather data by <a href="https://open-meteo.com/" target="_blank" class="text-accent hover:underline">Open-Meteo.com</a>
    </footer>
  </div>

  <div id="error-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-500/20 border border-red-500/30 backdrop-blur text-sm px-5 py-3 rounded-xl z-50">
    <span id="error-message"></span>
    <button id="error-retry" class="ml-3 text-accent hover:underline">Retry</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/weather-codes.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/hourly-chart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
