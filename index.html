<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <meta name="description" content="Minimalist dark weather app — real-time conditions, 7-day forecast, and hourly timeline powered by Open-Meteo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='22' fill='%23F5A524'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: { muted: '#8A8A8E', accent: '#F5A524' },
          animation: { float: 'float 6s ease-in-out infinite' },
          keyframes: {
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans text-white">
  <div class="app-shell max-w-7xl mx-auto px-6 md:px-10 py-6 lg:py-4 flex flex-col">

    <!-- Header: 3-col grid, kota+tanggal di tengah, tombol °C di kanan -->
    <header class="shrink-0 grid grid-cols-[1fr_auto_1fr] items-center gap-2">
      <div></div>

      <div class="relative flex items-center justify-center gap-3 flex-wrap">
        <button id="city-button" aria-label="Change city" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="city-name" class="text-sm whitespace-nowrap">Loading...</span>
          <svg class="w-3.5 h-3.5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <span id="date-text" class="text-xs text-muted whitespace-nowrap"></span>

        <div id="search-panel" class="hidden absolute top-full mt-3 left-1/2 -translate-x-1/2 z-20 w-80 max-w-[calc(100vw-2rem)] bg-black/90 backdrop-blur-xl border border-white/10 rounded-2xl p-3 shadow-2xl">
          <input id="search-input" type="text" placeholder="Search city..." autocomplete="off"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-sm placeholder-muted focus:outline-none focus:border-accent/50 transition">
          <ul id="search-results" class="mt-2 space-y-1 max-h-64 overflow-y-auto"></ul>
        </div>
      </div>

      <div class="flex justify-end">
        <button id="unit-toggle" aria-label="Toggle temperature unit"
          class="px-3 py-1 text-xs rounded-full border border-white/10 hover:bg-white/5 transition">°C</button>
      </div>
    </header>

    <!-- Main: mengisi sisa tinggi, kolom sejajar di tengah (desktop) -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] gap-6 lg:gap-10 items-start lg:items-center py-4 lg:py-2">

      <!-- Left -->
      <section class="order-1">
        <div class="flex items-start">
          <span id="temp-value" class="text-8xl lg:text-[clamp(4rem,14vh,8.5rem)] font-extralight leading-none">--</span>
          <span class="text-2xl md:text-3xl font-light mt-2 md:mt-3 ml-1">°<span id="temp-unit">C</span></span>
        </div>
        <p id="condition-text" class="text-2xl md:text-3xl font-light mt-3">--</p>
        <p id="time-label" class="text-xs text-muted mt-1 h-4"></p>

        <div class="flex gap-10 mt-6">
          <div>
            <div class="flex items-center gap-1.5 text-muted text-xs">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
              </svg>
              <span>Wind</span>
            </div>
            <p class="text-2xl font-light mt-1">
              <span id="wind-value">--</span><span id="wind-unit" class="text-sm text-muted ml-1">km/h</span>
            </p>
          </div>
          <div>
            <div class="flex items-center gap-1.5 text-muted text-xs">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
              </svg>
              <span>Humidity</span>
            </div>
            <p class="text-2xl font-light mt-1">
              <span id="humidity-value">--</span><span class="text-sm text-muted ml-1">%</span>
            </p>
          </div>
        </div>
      </section>

      <!-- Center -->
      <section class="order-2 flex justify-center">
        <div class="relative w-56 h-56 md:w-64 md:h-64 lg:w-[clamp(10rem,28vh,17rem)] lg:h-[clamp(10rem,28vh,17rem)] flex items-center justify-center">
          <div id="weather-glow" class="absolute inset-0 glow-bg glow-day rounded-full"></div>
          <div id="weather-icon" class="relative w-40 h-40 md:w-48 md:h-48 lg:w-[clamp(7rem,20vh,12rem)] lg:h-[clamp(7rem,20vh,12rem)] animate-float flex items-center justify-center"></div>
        </div>
      </section>

      <!-- Right -->
      <section class="order-3 lg:justify-self-end w-full lg:w-auto">
        <div id="daily-list" class="daily-card rounded-3xl p-3 md:p-4 w-full lg:w-80"></div>
      </section>
    </main>

    <!-- Hourly -->
    <section class="shrink-0 mt-4 lg:mt-2">
      <div class="flex items-stretch gap-3">
        <div class="flex-1 overflow-x-auto no-scrollbar">
          <div id="hourly-track" class="relative min-w-[600px] md:min-w-0">
            <svg id="hourly-curve" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
            <div id="hourly-items" class="relative flex h-full"></div>
          </div>
        </div>
        <div class="flex flex-col justify-center gap-2">
          <button id="hour-prev" aria-label="Previous hours"
            class="w-9 h-9 rounded-lg border border-white/10 hover:bg-white/5 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button id="hour-next" aria-label="Next hours"
            class="w-9 h-9 rounded-lg border border-white/10 hover:bg-white/5 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="shrink-0 mt-4 lg:mt-3 text-center text-[11px] text-muted">
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline">Open-Meteo.com</a>
    </footer>
  </div>

  <div id="error-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 max-w-[calc(100vw-2rem)] bg-red-500/20 border border-red-500/30 backdrop-blur text-sm px-5 py-3 rounded-xl z-50 flex items-center gap-3">
    <span id="error-message"></span>
    <button id="error-retry" class="text-accent hover:underline whitespace-nowrap">Retry</button>
    <button id="error-dismiss" aria-label="Dismiss error" class="text-muted hover:text-white ml-1">✕</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/weather-codes.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/hourly-chart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
